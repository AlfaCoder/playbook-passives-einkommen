<!doctype html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="{{FONTS}}">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#0F1613;color:#E9F1EC;font-family:"IBM Plex Sans",sans-serif;position:relative}
.wrap{position:absolute;inset:0;padding:64px 72px 56px;display:flex;flex-direction:column}
.eye{font-family:"IBM Plex Mono",monospace;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:#8FB5A2}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:76px;line-height:1.04;margin:28px 0 0;letter-spacing:-.02em;max-width:900px}
h1 em{font-style:normal;color:#5CC79A}
.sub{font-size:30px;color:#B9CCC1;margin-top:auto;max-width:900px;line-height:1.35}
.dom{font-family:"IBM Plex Mono",monospace;font-size:22px;color:#8FB5A2;margin-top:22px;padding-top:18px;border-top:2px solid #2E4A3D}
.mark{position:absolute;right:72px;top:60px;display:flex;gap:10px;align-items:flex-end}
.mark i{display:block;width:26px;background:#5CC79A;border-radius:4px}
</style></head><body>
<div class="mark"><i style="height:34px;opacity:.45"></i><i style="height:58px;opacity:.7"></i><i style="height:84px"></i></div>
<div class="wrap">
<div class="eye">{{EYEBROW}}</div>
<h1>{{TITLE}}</h1>
<div class="sub">{{SUB}}</div>
<div class="dom">playbook-passives-einkommen.de</div>
</div>
</body></html>
